# Configure a default setup of Home Assistant (frontend, api, etc)
default_config:
python_script:

recorder:
  purge_keep_days: 370
  exclude:
    domains:
      - automation
      - update
    entity_globs:
      - sensor.*_last_seen
      - sensor.*_linkquality
      - sensor.sun*
      - weather.*
      - sensor.clock*
      - sensor.date*
      - sensor.glances*
      - sensor.load_*m
      - sensor.time*
      - sensor.uptime*
      - sensor.home*
      - number.office*
      - select.office*
    entities:
      - sensor.date
      - sensor.last_boot # Comes from 'systemmonitor' sensor platform
      - sun.sun # Don't record sun data
      - sensor.home_assistant_v2_db
      - weather.openweathermap
    event_types:
      - call_service # Don't record actions  
      
#discovery:
#  enable:
#    - lg_smart_device

zeroconf:

logger:
  default: info

# influxdb:
#   database: homeassistant
#   host: a0d7b954-influxdb
