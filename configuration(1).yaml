  #sensors: [temperature, humidity, power, current, voltage, rssi, energy]
  #devices:
    #pow_lava_loucas:
      #name: Sonoff Pow
      #force_update: True
      #sensors: [temperature, humidity, power, current, voltage, rssi]

input_boolean: !include inputs_booleans.yaml
input_number: !include inputs_numbers.yaml
input_datetime: !include inputs_datetimes.yaml
group: !include groups.yaml
automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml
sensor: !include_dir_merge_list sensors/
cloud: !include cloud.yaml
irrigation_unlimited: !include config_irrigation_unlimited.yaml
utility_meter: !include utilitymeter.yaml
mqtt: !include mqtt.yaml
template: !include template.yaml
