i2c:
  sda: 4
  scl: 5
  scan: true
  id: bus_a

pcf8574:
  - id: 'pcf8574_hub_out_1'
    address: 0x24

  - id: 'pcf8574_hub_in_1'
    address: 0x22

# Individual outputs
switch:
  - platform: gpio
    name: "Rele 1"
    pin:
      pcf8574: pcf8574_hub_out_1
      number: 0
      mode: OUTPUT
      inverted: true
    id: rele1
    restore_mode: DISABLED
    on_turn_on:
      script.execute: rele1statechanged
    on_turn_off:
      script.execute: rele1statechanged

  - platform: gpio
    name: "Rele 2"
    pin:
      pcf8574: pcf8574_hub_out_1
      number: 1
      mode: OUTPUT
      inverted: true
    id: rele2
