      inverted: true
    id: rele8
    restore_mode: DISABLED
    on_turn_on:
      script.execute: rele8statechanged
    on_turn_off:
      script.execute: rele8statechanged

  - platform: template
    name: "Todos"
    id: rele_todos
    optimistic: true
    restore_mode: DISABLED
    on_turn_on:
      then:
        - switch.turn_on: rele1
        - switch.turn_on: rele2
        - switch.turn_on: rele3
        - switch.turn_on: rele4
        - switch.turn_on: rele5
        - switch.turn_on: rele6
        - switch.turn_on: rele7
        - switch.turn_on: rele8
    on_turn_off:
      then:
        - switch.turn_off: rele1
        - switch.turn_off: rele2
        - switch.turn_off: rele3
        - switch.turn_off: rele4
        - switch.turn_off: rele5
        - switch.turn_off: rele6
        - switch.turn_off: rele7
        - switch.turn_off: rele8

  # Switch para ativar logs de ADC (agora com ações válidas)
  - platform: template
    name: "ADC Debug Logging"
    id: adc_logging_switch
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    icon: mdi:debug-step-over
    turn_on_action:
      - globals.set:
          id: adc_log_enabled
          value: 'true'
    turn_off_action:
      - globals.set:
          id: adc_log_enabled
          value: 'false'

