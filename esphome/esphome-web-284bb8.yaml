    mode: restart
    then:
      - if:
          condition:
            switch.is_on: rele1
          then:
            - globals.set:
                id: rele1On
                value: 'true'
            - globals.set:
                id: rele1_on_time
                value: !lambda 'return (int)id(uptime_seconds).state;'
