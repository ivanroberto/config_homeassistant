# ===== SENSORS (inclui uptime) =====
sensor:
  - platform: uptime
    name: "Uptime Seconds"
    id: uptime_seconds
    update_interval: 1s
    internal: true

  - platform: adc
    pin: 35
    name: "ADC2 0-5V"
    id: adc2_sensor
    update_interval: 2s
    attenuation: 12db
    internal: true
    filters:
      - lambda:
          if (x >= 3.11) {
            return x * 1.60256;
          } else if (x <= 0.15) {
            return 0;
          } else {
            return x * 1.51;
          }

  - platform: adc
    pin: 34
    name: "ADC1 0-5V"
    id: adc1_sensor
    update_interval: 2s
    attenuation: 12db
    internal: true
    filters:
      - lambda:
          if (x >= 3.11) {
            return x * 1.60256;
          } else if (x <= 0.15) {
            return 0;
          } else {
            return x * 1.51;
          }

# ===== NUMBER ENTITIES PARA CONFIGURAR TIMEOUTS (com verificação imediata) =====
number:
  - platform: template
    name: "Rele 1 Tempo Máx. (s)"
    id: rele1_max_on_number
    min_value: 0
    max_value: 86400
    step: 1
    optimistic: true
    restore_value: yes
    set_action:
      - globals.set:
          id: rele1_max_on
          value: !lambda 'return (int)x;'
      - if:
          condition:
            - switch.is_on: rele1
            - lambda: 'return (id(rele1_max_on) > 0) && (((int)id(uptime_seconds).state - id(rele1_on_time)) >= id(rele1_max_on));'
          then:
            - lambda: |-
                ESP_LOGI("rele_timeout", "Rele 1 desligado por timeout (max=%d s, elapsed=%d s)", id(rele1_max_on), ((int)id(uptime_seconds).state - id(rele1_on_time)));
            - switch.turn_off: rele1
            - globals.set:
                id: rele1_on_time
                value: '0'

