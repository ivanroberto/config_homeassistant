esphome:
  name: medidor-dds238        # ← nunca mude após o primeiro flash
  friendly_name: Medidor DDS238

esp8266:
  board: esp01_1m
  restore_from_flash: true

preferences:
  flash_write_interval: 60s

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  min_auth_mode: WPA2
  ap:
    ssid: "DDS238-2 Hotspot"
    password: "change_me"

captive_portal:

logger:
  baud_rate: 0
  level: WARN

api:

ota:
  platform: esphome

web_server:
  port: 80

uart:
  rx_pin: GPIO3
  tx_pin: GPIO1
  baud_rate: 9600

time:
  - platform: sntp
    id: sntp_time
    timezone: "America/Sao_Paulo"
    on_time:
      - seconds: 0
        minutes: 0
        hours: 0
        then:
          - lambda: 'id(energia_ontem_sensor).publish_state(id(energia_hoje_sensor).state);'

tuya:
  time_id: sntp_time

globals:
  - id: v_fault_at
    type: int
    restore_value: no
    initial_value: '0'
  - id: p_fault_at
    type: int
    restore_value: no
    initial_value: '0'

# ── Controle ──────────────────────────────────────────────────────────────────
switch:
  - platform: tuya
    name: "Carga Principal"
    id: relesalida
    switch_datapoint: 1
    restore_mode: RESTORE_DEFAULT_ON

  - platform: template
    name: "Proteção Tensão"
    id: flag_prot_tensao
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - lambda: 'id(v_fault_at) = 0;'

  - platform: template
    name: "Proteção Potência"
    id: flag_prot_potencia
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - lambda: 'id(p_fault_at) = 0;'

# ── Limites configuráveis ─────────────────────────────────────────────────────
number:
  - platform: template
    name: "Limite Tensão Mínima (V)"
    id: tensao_min
    unit_of_measurement: V
    min_value: 0
    max_value: 250
    step: 1
    initial_value: 90
    optimistic: true
    restore_value: true
    mode: box

  - platform: template
    name: "Limite Tensão Máxima (V)"
    id: tensao_max
    unit_of_measurement: V
    min_value: 0
    max_value: 260
    step: 1
    initial_value: 140
    optimistic: true
    restore_value: true
    mode: box

  - platform: template
    name: "Limite Potência Máxima (W)"
    id: pot_max
    unit_of_measurement: W
    min_value: 0
    max_value: 5000
    step: 10
    initial_value: 3000
    optimistic: true
    restore_value: true
    mode: box

  - platform: template
    name: "Tempo Proteção Tensão (s)"
    id: tempo_v
    unit_of_measurement: s
    min_value: 0
    max_value: 60
    step: 1
    initial_value: 0
    optimistic: true
    restore_value: true
    mode: box

  - platform: template
    name: "Tempo Proteção Potência (s)"
    id: tempo_p
    unit_of_measurement: s
    min_value: 0
    max_value: 120
    step: 1
    initial_value: 10
    optimistic: true
    restore_value: true
    mode: box

# ── Sensores ──────────────────────────────────────────────────────────────────
sensor:
  - platform: tuya
    id: v_sensor
    name: "Tensão"
    sensor_datapoint: 20
    unit_of_measurement: V
    accuracy_decimals: 1
    device_class: voltage
    state_class: measurement
    filters:
      - multiply: 0.1
    on_value:
      then:
        - lambda: |-
            if (!id(flag_prot_tensao).state) { id(v_fault_at) = 0; return; }
            bool fault = (x > id(tensao_max).state || x < id(tensao_min).state);
            if (!fault) { id(v_fault_at) = 0; return; }
            int now = (int)(millis() / 1000);
            int delay_s = (int)id(tempo_v).state;
            if (id(v_fault_at) == 0) id(v_fault_at) = now;
            if (delay_s == 0 || (now - id(v_fault_at)) >= delay_s) {
              if (id(relesalida).state) {
                ESP_LOGW("protection", "Tensao fora da faixa (%.1f V) — desligando", x);
                id(relesalida).turn_off();
              }
              id(v_fault_at) = 0;
            }

  - platform: tuya
    id: p_sensor
    name: "Potência Ativa"
    sensor_datapoint: 19
    unit_of_measurement: W
    accuracy_decimals: 1
    device_class: power
    state_class: measurement
    filters:
      - multiply: 0.1
    on_value:
      then:
        - lambda: |-
            if (!id(flag_prot_potencia).state) { id(p_fault_at) = 0; return; }
            bool fault = (x > id(pot_max).state);
            if (!fault) { id(p_fault_at) = 0; return; }
            int now = (int)(millis() / 1000);
            int delay_s = (int)id(tempo_p).state;
            if (id(p_fault_at) == 0) id(p_fault_at) = now;
            if (delay_s == 0 || (now - id(p_fault_at)) >= delay_s) {
              if (id(relesalida).state) {
                ESP_LOGW("protection", "Sobrepotencia (%.1f W) — desligando", x);
                id(relesalida).turn_off();
              }
              id(p_fault_at) = 0;
            }

  - platform: tuya
    name: "Corrente"
    sensor_datapoint: 18
    unit_of_measurement: A
    accuracy_decimals: 3
    device_class: current
    state_class: measurement
    filters:
      - multiply: 0.001

  - platform: tuya
    name: "Energia Total"
    sensor_datapoint: 101
    unit_of_measurement: kWh
    accuracy_decimals: 3
    device_class: energy
    state_class: total_increasing
    filters:
      - multiply: 0.000001    # ← era 0.001 (mostrava Wh em vez de kWh)

  - platform: total_daily_energy
    name: "Energia Hoje"
    id: energia_hoje_sensor
    power_id: p_sensor
    method: trapezoid
    restore: true
    unit_of_measurement: kWh
    accuracy_decimals: 3
    device_class: energy
    state_class: total_increasing

  - platform: template
    name: "Energia Ontem"
    id: energia_ontem_sensor
    unit_of_measurement: kWh
    accuracy_decimals: 3
    device_class: energy
    state_class: total_increasing
    update_interval: never

button:
  - platform: restart
    name: "Reiniciar"