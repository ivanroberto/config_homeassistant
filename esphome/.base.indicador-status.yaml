---
esphome:
  name: $devicename
  platform: ESP8266
  board: esp01_1m  
# Monitor the Wifi connection status
binary_sensor:
  - platform: status
    name: ${devicename}_wifi
    #id: indicador_status_andar_2

# Configure each pixel as a single light (attention memory consuming)
light:
  #- platform: fastled_clockless
  - platform: neopixelbus
    type: GRB
    variant: WS2812
  #  chipset: WS2812B
    pin: GPIO03
    method: ESP8266_DMA
    id: light_fastled
    num_leds: 8
  #  rgb_order: GRB
    name: ${devicename}_barra_leds
    effects:
      - strobe:
      - random:
      - pulse:
  - platform: partition
    name: ${devicename}_alarme_portoes
    segments:
      - id: light_fastled
        from: 0
        to: 0
    effects:
      - strobe:
      - random:
      - pulse:
  - platform: partition
    name: ${devicename}_alarme_externo
    segments:
      - id: light_fastled
        from: 1
        to: 1
    effects:
      - strobe:
      - random:
      - pulse:
  - platform: partition
    name: ${devicename}_bateria_fraca
    segments:
      - id: light_fastled
        from: 2
        to: 2
    effects:
      - strobe:
      - pulse:
  - platform: partition
    name: ${devicename}_sensor_offline
    segments:
      - id: light_fastled
        from: 3
        to: 3
    effects:
      - strobe:
      - random:
      - pulse:
  - platform: partition
    name: ${devicename}_temperatura_geladeira
    segments:
      - id: light_fastled
        from: 4
        to: 4
    effects:
      - strobe:
      - random:
      - pulse:
  - platform: partition
    name: ${devicename}_caixa_agua
    segments:
      - id: light_fastled
        from: 6
        to: 6
    effects:
      - strobe:
      - random:
      - pulse:      
  - platform: partition
    name: ${devicename}_vazamentos
    segments:
      - id: light_fastled
        from: 7
        to: 7
    effects:
      - strobe:
      - random:
      - pulse:
    
