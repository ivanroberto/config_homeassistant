# Base completa para Sonoff Dual R3 v2 (ESP32 + BL0939 + 2 relés)

esphome:
  name: "${device_name}"
  friendly_name: "${friendly_name}"

esp32:
  board: esp32dev
  framework:
    type: esp-idf
    advanced:
      minimum_chip_revision: "3.0"
      sram1_as_iram: true

preferences:
  flash_write_interval: 30s    # ← era 60s (ou ausente). ESP32 tem NVS com wear leveling, 5s é seguro    

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  min_auth_mode: WPA2
  reboot_timeout: 0s        # ← continua: nunca reinicia por WiFi perdido
  ap:
    ssid: "${friendly_name} Hotspot"
    password: "${wifi_ap_password}"

api:
  reboot_timeout: 0s        # ← continua: nunca reinicia por API desconectada

safe_mode:                  # ← voltou, mas configurado corretamente
  num_attempts: 10          # padrão é 10 — explícito para clareza
  reboot_timeout: 15min     # aguarda 15min antes de considerar boot "estável"

captive_portal:

logger:
  level: WARN

ota:
  platform: esphome

web_server:
  port: 80

status_led:
  pin:
    number: GPIO13
    inverted: true

uart:
  tx_pin: GPIO25
  rx_pin: GPIO26
  baud_rate: 4800

time:
  - platform: sntp
    id: sntp_time
    timezone: "America/Sao_Paulo"
    servers:
      - 0.br.pool.ntp.org
      - 1.br.pool.ntp.org
    on_time:
      - seconds: 59
        minutes: 59
        hours: 23
        then:
          - globals.set:
              id: energy_yesterday_1
              value: !lambda 'return id(energy_today_1_sensor).state;'
          - globals.set:
              id: energy_yesterday_2
              value: !lambda 'return id(energy_today_2_sensor).state;'

button:
  - platform: restart
    name: "Reiniciar"

globals:
  # ── Detecção de clique/hold interruptor 1 ───────────────────────────────────
  - id: interruptor1_click_count
    type: int
    restore_value: no
    initial_value: '0'
  - id: interruptor1_hold_fired
    type: bool
    restore_value: no
    initial_value: 'false'
  # ── Detecção de clique/hold interruptor 2 ───────────────────────────────────
  - id: interruptor2_click_count
    type: int
    restore_value: no
    initial_value: '0'
  - id: interruptor2_hold_fired
    type: bool
    restore_value: no
    initial_value: 'false'

script:
  # ── Interruptor 1: hold timer ─────────────────────────────────────────────
  - id: interruptor1_hold_timer
    mode: restart
    then:
      - delay: 1s
      - globals.set:
          id: interruptor1_hold_fired
          value: 'true'
      - script.stop: interruptor1_click_eval   # ← cancela eval, hold tem prioridade
      - globals.set:
          id: interruptor1_click_count
          value: '0'
      - text_sensor.template.publish:
          id: interruptor1acao
          state: "hold"

  # ── Interruptor 1: avalia single/double ──────────────────────────────────
  - id: interruptor1_click_eval
    mode: restart
    then:
      - delay: 500ms
      - if:
          condition:
            lambda: 'return id(interruptor1_click_count) == 1 && !id(interruptor1).state;'  # ← botão já solto
          then:
            - text_sensor.template.publish:
                id: interruptor1acao
                state: "single"
      - if:
          condition:
            lambda: 'return id(interruptor1_click_count) >= 2 && !id(interruptor1).state;'  # ← botão já solto
          then:
            - text_sensor.template.publish:
                id: interruptor1acao
                state: "double"
      - globals.set:
          id: interruptor1_click_count
          value: '0'
      - globals.set:
          id: interruptor1_hold_fired
          value: 'false'

  # ── Interruptor 2: hold timer ─────────────────────────────────────────────
  - id: interruptor2_hold_timer
    mode: restart
    then:
      - delay: 1s
      - globals.set:
          id: interruptor2_hold_fired
          value: 'true'
      - script.stop: interruptor2_click_eval
      - globals.set:
          id: interruptor2_click_count
          value: '0'
      - text_sensor.template.publish:
          id: interruptor2acao
          state: "hold"

  # ── Interruptor 2: avalia single/double ──────────────────────────────────
  - id: interruptor2_click_eval
    mode: restart
    then:
      - delay: 500ms
      - if:
          condition:
            lambda: 'return id(interruptor2_click_count) == 1 && !id(interruptor2).state;'  # ← botão já solto
          then:
            - text_sensor.template.publish:
                id: interruptor2acao
                state: "single"
      - if:
          condition:
            lambda: 'return id(interruptor2_click_count) >= 2 && !id(interruptor2).state;'  # ← botão já solto
          then:
            - text_sensor.template.publish:
                id: interruptor2acao
                state: "double"
      - globals.set:
          id: interruptor2_click_count
          value: '0'
      - globals.set:
          id: interruptor2_hold_fired
          value: 'false'

switch:
  - platform: gpio
    name: "Rele 1"
    pin:
      number: GPIO27
      inverted: false
    id: rele1
    restore_mode: RESTORE_DEFAULT_OFF   # ← era DISABLED
    on_turn_on:
      then:
        - script.execute: rele1statechanged
    on_turn_off:
      then:
        - script.execute: rele1statechanged

  - platform: gpio
    name: "Rele 2"
    pin:
      number: GPIO14
      inverted: false
    id: rele2
    restore_mode: RESTORE_DEFAULT_OFF   # ← era DISABLED
    on_turn_on:
      then:
        - script.execute: rele2statechanged
    on_turn_off:
      then:
        - script.execute: rele2statechanged

  # Config — Interruptores
  - platform: template
    name: "Interruptor 1 Conectado"
    id: interruptor1conectado
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: config

  - platform: template
    name: "Interruptor 2 Conectado"
    id: interruptor2conectado
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: config

select:
  - platform: template
    name: "Interruptor 1 Tipo"
    optimistic: true
    restore_value: true
    initial_option: "Comum"
    options: ["Comum", "Pulso", "Cenas"]
    id: interruptor1tipo
    entity_category: config

  - platform: template
    name: "Interruptor 2 Tipo"
    optimistic: true
    restore_value: true
    initial_option: "Comum"
    options: ["Comum", "Pulso", "Cenas"]
    id: interruptor2tipo
    entity_category: config

text_sensor:
  - platform: template
    name: "Interruptor 1 Ação"
    id: interruptor1acao

  - platform: template
    name: "Interruptor 2 Ação"
    id: interruptor2acao

binary_sensor:
  - platform: gpio
    name: "Interruptor 1"
    pin:
      number: GPIO32
      mode: INPUT_PULLUP
      inverted: true
    id: interruptor1
    filters:
      - delayed_on_off: 50ms    # ← 150ms → 50ms
    on_press:
      then:
        # Comum e Pulso: toggle relé
        - if:
            condition:
              lambda: 'return (id(interruptor1tipo).current_option() == "Comum" || id(interruptor1tipo).current_option() == "Pulso") && id(interruptor1conectado).state;'
            then:
              switch.toggle: rele1
        # Pulso: inicia detecção — click_eval reinicia janela de 500ms a cada press
        - if:
            condition:
              lambda: 'return id(interruptor1tipo).current_option() == "Pulso" && id(interruptor1conectado).state;'
            then:
              - globals.set:
                  id: interruptor1_hold_fired
                  value: 'false'
              - lambda: 'id(interruptor1_click_count) += 1;'
              - script.execute: interruptor1_hold_timer
              - script.execute: interruptor1_click_eval   # ← movido para cá
    on_release:
      then:
        # Comum: toggle no release
        - if:
            condition:
              lambda: 'return id(interruptor1tipo).current_option() == "Comum" && id(interruptor1conectado).state;'
            then:
              switch.toggle: rele1
        # Pulso: para hold_timer se ainda não disparou (click_eval não é chamado aqui)
        - if:
            condition:
              lambda: 'return id(interruptor1tipo).current_option() == "Pulso" && id(interruptor1conectado).state && !id(interruptor1_hold_fired);'
            then:
              - script.stop: interruptor1_hold_timer

  - platform: gpio
    name: "Interruptor 2"
    pin:
      number: GPIO33
      mode: INPUT_PULLUP
      inverted: true
    id: interruptor2
    filters:
      - delayed_on_off: 50ms    # ← 150ms → 50ms
    on_press:
      then:
        - if:
            condition:
              lambda: 'return (id(interruptor2tipo).current_option() == "Comum" || id(interruptor2tipo).current_option() == "Pulso") && id(interruptor2conectado).state;'
            then:
              switch.toggle: rele2
        - if:
            condition:
              lambda: 'return id(interruptor2tipo).current_option() == "Pulso" && id(interruptor2conectado).state;'
            then:
              - globals.set:
                  id: interruptor2_hold_fired
                  value: 'false'
              - lambda: 'id(interruptor2_click_count) += 1;'
              - script.execute: interruptor2_hold_timer
              - script.execute: interruptor2_click_eval
    on_release:
      then:
        - if:
            condition:
              lambda: 'return id(interruptor2tipo).current_option() == "Comum" && id(interruptor2conectado).state;'
            then:
              switch.toggle: rele2
        - if:
            condition:
              lambda: 'return id(interruptor2tipo).current_option() == "Pulso" && id(interruptor2conectado).state && !id(interruptor2_hold_fired);'
            then:
              - script.stop: interruptor2_hold_timer

  - platform: gpio
    name: "Botão"
    pin:
      number: GPIO0
      mode: INPUT_PULLUP
      inverted: true
    id: button_onboard
    filters:
      - delayed_on_off: 50ms
    on_multi_click:
      - timing:
          - ON for at most 900ms
          - OFF for at least 600ms
        then:
          switch.toggle: rele1
      - timing:
          - ON for at most 500ms
          - OFF for at most 400ms
          - ON for at most 500ms
          - OFF for at least 250ms
        then:
          switch.toggle: rele2
      - timing:
          - ON for at least 1s
        then:
          - switch.turn_off: rele1
          - switch.turn_off: rele2

packages:
  chip: !include bl0939-driver.yaml
  channel1: !include pow-channel1.yaml
  channel2: !include pow-channel2.yaml