esphome:
  name: "${device_name}"
  friendly_name: "${friendly_name}"

esp8266:
  board: esp01_1m
  restore_from_flash: true

preferences:
  flash_write_interval: 60s

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  min_auth_mode: WPA2
  reboot_timeout: 0s
  ap:
    ssid: "${friendly_name} Hotspot"
    password: "${wifi_ap_password}"

api:
  reboot_timeout: 0s

safe_mode:
  num_attempts: 10
  reboot_timeout: 15min

captive_portal:

logger:
  baud_rate: 0
  level: WARN

ota:
  platform: esphome

web_server:
  port: 80

status_led:
  pin:
    number: 13
    inverted: true

uart:
  rx_pin: GPIO3
  tx_pin: GPIO1
  baud_rate: 4800
  parity: EVEN

time:
  - platform: sntp
    id: sntp_time
    timezone: "America/Sao_Paulo"
    servers:
      - 0.br.pool.ntp.org
      - 1.br.pool.ntp.org
    on_time:
      - seconds: 59
        minutes: 59
        hours: 23
        then:
          - globals.set:
              id: energy_yesterday_1
              value: !lambda 'return id(energy_today_1_sensor).state;'

button:
  - platform: restart
    name: "Reiniciar"

switch:
  - platform: gpio
    name: "Rele"
    pin:
      number: 12
      inverted: false
    id: rele1
    restore_mode: RESTORE_DEFAULT_OFF   # ← era DISABLED
    on_turn_on:
      then:
        - script.execute: rele1statechanged
    on_turn_off:
      then:
        - script.execute: rele1statechanged

binary_sensor:
  - platform: gpio
    name: "Botão"
    pin:
      number: 0
      mode: INPUT_PULLUP
      inverted: true
    id: button_onboard
    filters:
      - delayed_on_off: 50ms
    on_press:
      then:
        - switch.toggle: rele1

packages:
  chip: !include cse7766-driver.yaml
  channel1: !include pow-channel1.yaml