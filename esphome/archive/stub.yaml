# ===== GLOBALS =====
globals:
  - id: rele1On
    type: bool
    restore_value: yes
  - id: rele2On
    type: bool
    restore_value: yes
  - id: rele3On
    type: bool
    restore_value: yes
  - id: rele4On
    type: bool
    restore_value: yes

  - id: rele1_max_on
    type: int
    restore_value: yes
    initial_value: '0'
  - id: rele1_on_time
    type: int
    restore_value: no
    initial_value: '0'

  - id: rele2_max_on
    type: int
    restore_value: yes
    initial_value: '0'
  - id: rele2_on_time
    type: int
    restore_value: no
    initial_value: '0'

  - id: rele3_max_on
    type: int
    restore_value: yes
    initial_value: '0'
  - id: rele3_on_time
    type: int
    restore_value: no
    initial_value: '0'

  - id: rele4_max_on
    type: int
    restore_value: yes
    initial_value: '0'
  - id: rele4_on_time
    type: int
    restore_value: no
    initial_value: '0'

  # controla logs de timeout (switch no HA)
  - id: timeout_log_enabled
    type: bool
    restore_value: yes
    initial_value: 'false'

# ===== SELECTS (PowerOnState) =====
select:
  - platform: template
    name: "Rele 1 PowerOnState"
    optimistic: true
    restore_value: true
    options: ["Restore_Last_State", "Always_Off", "Always_On"]
    id: rele1last
    entity_category: config
  - platform: template
    name: "Rele 2 PowerOnState"
    optimistic: true
    restore_value: true
    options: ["Restore_Last_State", "Always_Off", "Always_On"]
    id: rele2last
    entity_category: config
  - platform: template
    name: "Rele 3 PowerOnState"
    optimistic: true
    restore_value: true
    options: ["Restore_Last_State", "Always_Off", "Always_On"]
    id: rele3last
    entity_category: config
  - platform: template
    name: "Rele 4 PowerOnState"
    optimistic: true
    restore_value: true
    options: ["Restore_Last_State", "Always_Off", "Always_On"]
    id: rele4last
    entity_category: config

  - platform: template
    name: "Interruptor 1 Tipo"
    optimistic: true
    restore_value: true
    options: ["Comum", "Pulso", "Cenas"]
    id: interruptor1tipo
    entity_category: config
  - platform: template
    name: "Interruptor 2 Tipo"
    optimistic: true
    restore_value: true
    options: ["Comum", "Pulso", "Cenas"]
    id: interruptor2tipo
    entity_category: config
  - platform: template
    name: "Interruptor 3 Tipo"
    optimistic: true
    restore_value: true
    options: ["Comum", "Pulso", "Cenas"]
    id: interruptor3tipo
    entity_category: config
  - platform: template
    name: "Interruptor 4 Tipo"
    optimistic: true
    restore_value: true
    options: ["Comum", "Pulso", "Cenas"]
    id: interruptor4tipo
    entity_category: config

# ===== SCRIPTS QUE SINCRONIZAM O ESTADO QUANDO O RELÉ MUDA =====
script:
  - id: rele1statechanged
    mode: restart
    then:
      - if:
          condition:
            switch.is_on: rele1
          then:
            - globals.set:
                id: rele1On
                value: 'true'
            - globals.set:
                id: rele1_on_time
                value: !lambda 'return (int)id(uptime_seconds).state;'
          else:
            - globals.set:
                id: rele1On
                value: 'false'
            - globals.set:
                id: rele1_on_time
                value: '0'

  - id: rele2statechanged
    mode: restart
    then:
      - if:
          condition:
            switch.is_on: rele2
          then:
            - globals.set:
                id: rele2On
                value: 'true'
            - globals.set:
                id: rele2_on_time
                value: !lambda 'return (int)id(uptime_seconds).state;'
          else:
            - globals.set:
                id: rele2On
                value: 'false'
            - globals.set:
                id: rele2_on_time
                value: '0'

  - id: rele3statechanged
    mode: restart
    then:
      - if:
          condition:
            switch.is_on: rele3
          then:
            - globals.set:
                id: rele3On
                value: 'true'
            - globals.set:
                id: rele3_on_time
                value: !lambda 'return (int)id(uptime_seconds).state;'
          else:
            - globals.set:
                id: rele3On
                value: 'false'
            - globals.set:
                id: rele3_on_time
                value: '0'

  - id: rele4statechanged
    mode: restart
    then:
      - if:
          condition:
            switch.is_on: rele4
          then:
            - globals.set:
                id: rele4On
                value: 'true'
            - globals.set:
                id: rele4_on_time
                value: !lambda 'return (int)id(uptime_seconds).state;'
          else:
            - globals.set:
                id: rele4On
                value: 'false'
            - globals.set:
                id: rele4_on_time
                value: '0'

# ===== SWITCHES (Relés e controle de logs) =====
switch:
  - platform: gpio
    name: "Rele 1"
    pin:
      number: 12
      inverted: false
    id: rele1
    restore_mode: DISABLED
    on_turn_on:
      script.execute: rele1statechanged
    on_turn_off:
      script.execute: rele1statechanged

  - platform: gpio
    name: "Rele 2"
    pin:
      number: 5
      inverted: false
    id: rele2
    restore_mode: DISABLED
    on_turn_on:
      script.execute: rele2statechanged
    on_turn_off:
      script.execute: rele2statechanged

  - platform: gpio
    name: "Rele 3"
    pin:
      number: 4
      inverted: false
    id: rele3
    restore_mode: DISABLED
    on_turn_on:
      script.execute: rele3statechanged
    on_turn_off:
      script.execute: rele3statechanged

  - platform: gpio
    name: "Rele 4"
    pin:
      number: 15
      inverted: false
    id: rele4
    restore_mode: DISABLED
    on_turn_on:
      script.execute: rele4statechanged
    on_turn_off:
      script.execute: rele4statechanged

  - platform: template
    name: "Todos"
    id: rele_todos
    optimistic: true
    restore_mode: DISABLED
    on_turn_on:
      then:
        - switch.turn_on: rele1
        - switch.turn_on: rele2
        - switch.turn_on: rele3
        - switch.turn_on: rele4
    on_turn_off:
      then:
        - switch.turn_off: rele1
        - switch.turn_off: rele2
        - switch.turn_off: rele3
        - switch.turn_off: rele4

  - platform: template
    name: "Timeout Logging"
    id: timeout_logging_switch
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    icon: mdi:debug-step-over
    turn_on_action:
      - globals.set:
          id: timeout_log_enabled
          value: 'true'
    turn_off_action:
      - globals.set:
          id: timeout_log_enabled
          value: 'false'

  - platform: template
    name: "Interruptor 1 Conectado"
    id: interruptor1conectado
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    entity_category: config
  - platform: template
    name: "Interruptor 2 Conectado"
    id: interruptor2conectado
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    entity_category: config
  - platform: template
    name: "Interruptor 3 Conectado"
    id: interruptor3conectado
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    entity_category: config
  - platform: template
    name: "Interruptor 4 Conectado"
    id: interruptor4conectado
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    entity_category: config

