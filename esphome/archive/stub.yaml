# ===== SENSORES =====
sensor:
  - platform: uptime
    name: "Uptime Seconds"
    id: uptime_seconds
    update_interval: 1s
    internal: true

# ===== NUMBERS PARA TIMEOUT =====
number:
  - platform: template
    name: "Rele 1 Tempo Máx. (s)"
    id: rele1_max_on_number
    min_value: 0
    max_value: 86400
    step: 1
    optimistic: true
    restore_value: yes
    set_action:
      - globals.set:
          id: rele1_max_on
          value: !lambda 'return (int)x;'
      - if:
          condition:
            - switch.is_on: rele1
            - lambda: 'return (id(rele1_max_on) > 0) && (((int)id(uptime_seconds).state - id(rele1_on_time)) >= id(rele1_max_on));'
          then:
            - lambda: |-
                if (id(timeout_log_enabled)) {
                  ESP_LOGI("rele_timeout", "Rele 1 desligado por timeout (max=%d s, elapsed=%d s)", id(rele1_max_on), ((int)id(uptime_seconds).state - id(rele1_on_time)));
                }
            - switch.turn_off: rele1
            - globals.set:
                id: rele1_on_time
                value: '0'

  - platform: template
    name: "Rele 2 Tempo Máx. (s)"
    id: rele2_max_on_number
    min_value: 0
    max_value: 86400
    step: 1
