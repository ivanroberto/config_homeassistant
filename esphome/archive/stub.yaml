# ===== INTERVAL UNICO: checagem de timeouts (1s) =====
interval:
  - interval: 1s
    then:
      - if:
          condition:
            - switch.is_on: rele1
            - lambda: 'return (id(rele1_max_on) > 0) && (((int)id(uptime_seconds).state - id(rele1_on_time)) >= id(rele1_max_on));'
          then:
            - lambda: |-
                if (id(timeout_log_enabled)) {
                  ESP_LOGI("rele_timeout", "Rele 1 desligado por timeout (max=%d s, elapsed=%d s)", id(rele1_max_on), ((int)id(uptime_seconds).state - id(rele1_on_time)));
                }
            - switch.turn_off: rele1
            - globals.set:
                id: rele1_on_time
                value: '0'

      - if:
          condition:
            - switch.is_on: rele2
            - lambda: 'return (id(rele2_max_on) > 0) && (((int)id(uptime_seconds).state - id(rele2_on_time)) >= id(rele2_max_on));'
          then:
            - lambda: |-
                if (id(timeout_log_enabled)) {
                  ESP_LOGI("rele_timeout", "Rele 2 desligado por timeout (max=%d s, elapsed=%d s)", id(rele2_max_on), ((int)id(uptime_seconds).state - id(rele2_on_time)));
                }
            - switch.turn_off: rele2
            - globals.set:
                id: rele2_on_time
                value: '0'

      - if:
          condition:
            - switch.is_on: rele3
            - lambda: 'return (id(rele3_max_on) > 0) && (((int)id(uptime_seconds).state - id(rele3_on_time)) >= id(rele3_max_on));'
          then:
            - lambda: |-
                if (id(timeout_log_enabled)) {
                  ESP_LOGI("rele_timeout", "Rele 3 desligado por timeout (max=%d s, elapsed=%d s)", id(rele3_max_on), ((int)id(uptime_seconds).state - id(rele3_on_time)));
                }
            - switch.turn_off: rele3
            - globals.set:
                id: rele3_on_time
                value: '0'

      - if:
          condition:
            - switch.is_on: rele4
            - lambda: 'return (id(rele4_max_on) > 0) && (((int)id(uptime_seconds).state - id(rele4_on_time)) >= id(rele4_max_on));'
          then:
            - lambda: |-
                if (id(timeout_log_enabled)) {
                  ESP_LOGI("rele_timeout", "Rele 4 desligado por timeout (max=%d s, elapsed=%d s)", id(rele4_max_on), ((int)id(uptime_seconds).state - id(rele4_on_time)));
                }
            - switch.turn_off: rele4
            - globals.set:
                id: rele4_on_time
                value: '0'