esphome:
  name: irrigacao-frente
  friendly_name: IrrigacaoFrente
  on_boot:
    priority: -100
    then:
      # PowerOnState behaviour (configurável via select)
      - if:
          condition:
            lambda: 'return ((id(rele1last).state == "Restore_Last_State") && (id(rele1On)));'
          then:
            switch.turn_on: rele1
      - if:
          condition:
            lambda: 'return id(rele1last).state == "Always_On";'
          then:
            switch.turn_on: rele1

      - if:
          condition:
            lambda: 'return ((id(rele2last).state == "Restore_Last_State") && (id(rele2On)));'
          then:
            switch.turn_on: rele2
      - if:
          condition:
            lambda: 'return id(rele2last).state == "Always_On";'
          then:
            switch.turn_on: rele2

      - if:
          condition:
            lambda: 'return ((id(rele3last).state == "Restore_Last_State") && (id(rele3On)));'
          then:
            switch.turn_on: rele3
      - if:
          condition:
            lambda: 'return id(rele3last).state == "Always_On";'
          then:
            switch.turn_on: rele3

      - if:
          condition:
            lambda: 'return ((id(rele4last).state == "Restore_Last_State") && (id(rele4On)));'
          then:
            switch.turn_on: rele4
      - if:
          condition:
            lambda: 'return id(rele4last).state == "Always_On";'
          then:
            switch.turn_on: rele4

      # Após breve delay, sincroniza globals com estado real dos switches (evita dessincronia)
      - delay: 2s
      - if:
          condition:
            switch.is_on: rele1
          then:
            - globals.set:
                id: rele1On
                value: 'true'
            - globals.set:
                id: rele1_on_time
                value: !lambda 'return (int)id(uptime_seconds).state;'
          else:
            - globals.set:
                id: rele1On
                value: 'false'
            - globals.set:
                id: rele1_on_time
                value: '0'
      - if:
          condition:
            switch.is_on: rele2
          then:
            - globals.set:
                id: rele2On
                value: 'true'
            - globals.set:
                id: rele2_on_time
                value: !lambda 'return (int)id(uptime_seconds).state;'
          else:
            - globals.set:
                id: rele2On
                value: 'false'
            - globals.set:
                id: rele2_on_time
                value: '0'
      - if:
          condition:
            switch.is_on: rele3
          then:
            - globals.set:
                id: rele3On
                value: 'true'
            - globals.set:
                id: rele3_on_time
                value: !lambda 'return (int)id(uptime_seconds).state;'
          else:
            - globals.set:
                id: rele3On
                value: 'false'
            - globals.set:
                id: rele3_on_time
                value: '0'
      - if:
          condition:
            switch.is_on: rele4
          then:
            - globals.set:
                id: rele4On
                value: 'true'
            - globals.set:
                id: rele4_on_time
                value: !lambda 'return (int)id(uptime_seconds).state;'
          else:
            - globals.set:
                id: rele4On
                value: 'false'
            - globals.set:
                id: rele4_on_time
                value: '0'

