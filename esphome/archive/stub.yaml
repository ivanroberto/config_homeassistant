# ===== BOTÕES (entradas) =====
binary_sensor:
  - platform: gpio
    name: "Interruptor 1"
    pin:
      number: 0
      inverted: true
    id: interruptor1
    on_press:
      then:
        if:
          condition:
            lambda: 'return ((id(interruptor1tipo).state == "Comum") && (id(interruptor1conectado).state) || (id(interruptor1tipo).state == "Pulso") && (id(interruptor1conectado).state));'
          then:
            switch.toggle: rele1
    on_release:
      then:
        if:
          condition:
            lambda: 'return ((id(interruptor1tipo).state == "Comum") && (id(interruptor1conectado).state));'
          then:
            switch.toggle: rele1
    on_multi_click:
      - timing:
        - ON for at most 900ms
        - OFF for at least 600ms
        then:
          - text_sensor.template.publish:
              id: interruptor1acao
              state: "1_single"
          - delay: 1s
          - text_sensor.template.publish:
              id: interruptor1acao
              state: "Nenhuma"
      - timing:
          - ON for at most 500ms
          - OFF for at most 400ms
          - ON for at most 500ms
          - OFF for at least 250ms
        then:
          - text_sensor.template.publish:
              id: interruptor1acao
              state: "1_double"
          - delay: 1s
          - text_sensor.template.publish:
              id: interruptor1acao
              state: "Nenhuma"
      - timing:
          - ON for at least 1s
        then:
          - text_sensor.template.publish:
              id: interruptor1acao
              state: "1_hold"
          - delay: 1s
          - text_sensor.template.publish:
              id: interruptor1acao
