esphome:
  name: luz-alerta
  platform: ESP8266
  board: esp12e

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:

logger:

ota:

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO0
      mode: INPUT_PULLUP
      inverted: True
    name: "Luz Alerta Botao"
    on_press:
        then:
            - light.toggle: light_1

light:
  - platform: fastled_clockless
    id: light_1
    name: "Luz Alerta"
    power_supply: "main_power_supply"
    restore_mode: ALWAYS_OFF
    chipset: WS2812B
    pin: GPIO2
    num_leds: 8
    rgb_order: GRB
    effects:
      - addressable_rainbow:
          name: Rainbow Effect With Custom Values
          speed: 10
          width: 100
      - random:
          name: "Slow Random Effect"
          transition_length: 30s
          update_interval: 30s
      - random:
          name: "Fast Random Effect"
          transition_length: 4s
          update_interval: 5s
      - strobe:
          name: Water Leak Alarm
          colors:
            - state: True
              brightness: 80%
              red: 0%
              green: 0%
              blue: 100%
              duration: 200ms
            - state: False
              duration: 200ms
            - state: True
              brightness: 80%
              red: 0%
              green: 0%
              blue: 100%
              duration: 200ms
            - state: False
              duration: 400ms
      - strobe:
          name: CO Alarm
          colors:
            - state: True
              brightness: 80%
              red: 0%
              green: 100%
              blue: 0%
              duration: 200ms
            - state: False
              duration: 200ms
            - state: True
              brightness: 80%
              red: 0%
              green: 100%
              blue: 0%
              duration: 200ms
            - state: False
              duration: 400ms
      - strobe:
          name: Fire Alarm
          colors:
            - state: True
              brightness: 80%
              red: 100%
              green: 0%
              blue: 0%
              duration: 200ms
            - state: False
              duration: 200ms
            - state: True
              brightness: 80%
              red: 100%
              green: 0%
              blue: 0%
              duration: 200ms
            - state: False
              duration: 400ms
      - strobe:
          name: Intrusion Alarm
          colors:
            - state: True
              brightness: 80%
              red: 100%
              green: 0%
              blue: 0%
              duration: 200ms
            - state: False
              duration: 200ms
            - state: True
              brightness: 80%
              red: 0%
              green: 0%
              blue: 100%
              duration: 200ms
            - state: False
              duration: 400ms


status_led:
  pin:
    number: GPIO16
    inverted: yes

power_supply:
  - id: "main_power_supply"
    pin: GPIO12