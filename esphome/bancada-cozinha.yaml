esphome:
  name: "bancada-cozinha"
  friendly_name: BancadaCozinha
  on_boot:
    priority: -100
    then:
      - delay: 3s

      # Atualiza numbers com valores dos globals restaurados
      - number.set:
          id: rele1_max_on_number
          value: !lambda 'return (float)id(rele1_max_on);'
      - number.set:
          id: rele2_max_on_number
          value: !lambda 'return (float)id(rele2_max_on);'

      # ----- APLICAR POWER-ON STATE -----
      - if:
          condition:
            lambda: 'return (id(rele1last).current_option() == "Always_On") || ((id(rele1last).current_option() == "Restore_Last_State") && id(rele1On));'
          then:
            switch.turn_on: rele1
          else:
            - if:
                condition:
                  lambda: 'return id(rele1last).current_option() == "Always_Off";'
                then:
                  switch.turn_off: rele1
      - if:
          condition:
            lambda: 'return (id(rele2last).current_option() == "Always_On") || ((id(rele2last).current_option() == "Restore_Last_State") && id(rele2On));'
          then:
            switch.turn_on: rele2
          else:
            - if:
                condition:
                  lambda: 'return id(rele2last).current_option() == "Always_Off";'
                then:
                  switch.turn_off: rele2

      - delay: 500ms

      # Sincroniza releXOn com estado real dos relés
      - if:
          condition:
            switch.is_on: rele1
          then:
            - globals.set:
                id: rele1On
                value: 'true'
            - globals.set:
                id: rele1_on_time
                value: !lambda 'return (int)id(uptime_seconds).state;'
          else:
            - globals.set:
                id: rele1On
                value: 'false'
            - globals.set:
                id: rele1_on_time
                value: '0'
      - if:
          condition:
            switch.is_on: rele2
          then:
            - globals.set:
                id: rele2On
                value: 'true'
            - globals.set:
                id: rele2_on_time
                value: !lambda 'return (int)id(uptime_seconds).state;'
          else:
            - globals.set:
                id: rele2On
                value: 'false'
            - globals.set:
                id: rele2_on_time
                value: '0'

esp8266:
  board: esp01_1m
  restore_from_flash: true

preferences:
  flash_write_interval: 10s

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  min_auth_mode: WPA2
  ap:
    ssid: "BancadaCozinha Hotspot"
    password: "change_me"

captive_portal:

logger:

api:

ota:
  platform: esphome

button:
  - platform: restart
    name: "Reiniciar"

globals:
  - id: rele1On
    type: bool
    restore_value: yes
  - id: rele2On
    type: bool
    restore_value: yes

  - id: rele1_max_on
    type: int
    restore_value: yes
    initial_value: '0'
  - id: rele1_on_time
    type: int
    restore_value: no
    initial_value: '0'

  - id: rele2_max_on
    type: int
    restore_value: yes
    initial_value: '0'
  - id: rele2_on_time
    type: int
    restore_value: no
    initial_value: '0'

  - id: timeout_log_enabled
    type: bool
    restore_value: yes
    initial_value: 'false'

select:
  - platform: template
    name: "Rele 1 PowerOnState"
    optimistic: true
    restore_value: true
    options: ["Restore_Last_State", "Always_Off", "Always_On"]
    id: rele1last
    entity_category: config
  - platform: template
    name: "Rele 2 PowerOnState"
    optimistic: true
    restore_value: true
    options: ["Restore_Last_State", "Always_Off", "Always_On"]
    id: rele2last
    entity_category: config

  - platform: template
    name: "Interruptor 1 Tipo"
    optimistic: true
    restore_value: true
    options: ["Comum", "Pulso", "Cenas"]
    id: interruptor1tipo
    entity_category: config
  - platform: template
    name: "Interruptor 2 Tipo"
    optimistic: true
    restore_value: true
    options: ["Comum", "Pulso", "Cenas"]
    id: interruptor2tipo
    entity_category: config

script:
  - id: rele1statechanged
    mode: restart
    then:
      - if:
          condition:
            switch.is_on: rele1
          then:
            - globals.set:
                id: rele1On
                value: 'true'
            - globals.set:
                id: rele1_on_time
                value: !lambda 'return (int)id(uptime_seconds).state;'
          else:
            - globals.set:
                id: rele1On
                value: 'false'
            - globals.set:
                id: rele1_on_time
                value: '0'

  - id: rele2statechanged
    mode: restart
    then:
      - if:
          condition:
            switch.is_on: rele2
          then:
            - globals.set:
                id: rele2On
                value: 'true'
            - globals.set:
                id: rele2_on_time
                value: !lambda 'return (int)id(uptime_seconds).state;'
          else:
            - globals.set:
                id: rele2On
                value: 'false'
            - globals.set:
                id: rele2_on_time
                value: '0'

switch:
  - platform: gpio
    name: "Rele 1"
    pin:
      number: 13
      inverted: false
    id: rele1
    restore_mode: DISABLED
    on_turn_on:
      script.execute: rele1statechanged
    on_turn_off:
      script.execute: rele1statechanged

  - platform: gpio
    name: "Rele 2"
    pin:
      number: 12
      inverted: false
    id: rele2
    restore_mode: DISABLED
    on_turn_on:
      script.execute: rele2statechanged
    on_turn_off:
      script.execute: rele2statechanged

  - platform: template
    name: "Todos"
    id: rele_todos
    optimistic: true
    restore_mode: DISABLED
    on_turn_on:
      then:
        - switch.turn_on: rele1
        - switch.turn_on: rele2
    on_turn_off:
      then:
        - switch.turn_off: rele1
        - switch.turn_off: rele2

  - platform: template
    name: "Timeout Logging"
    id: timeout_logging_switch
    optimistic: true
    restore_mode: DISABLED
    icon: mdi:debug-step-over
    lambda: 'return id(timeout_log_enabled);'
    turn_on_action:
      - globals.set:
          id: timeout_log_enabled
          value: 'true'
    turn_off_action:
      - globals.set:
          id: timeout_log_enabled
          value: 'false'

  - platform: template
    name: "Interruptor 1 Conectado"
    id: interruptor1conectado
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    entity_category: config
  - platform: template
    name: "Interruptor 2 Conectado"
    id: interruptor2conectado
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    entity_category: config

  - platform: gpio
    id: led_status
    pin:
      number: 16
      inverted: true
    restore_mode: DISABLED
    internal: true

text_sensor:
  - platform: template
    name: "Interruptor 1 Ação"
    id: interruptor1acao
  - platform: template
    name: "Interruptor 2 Ação"
    id: interruptor2acao

binary_sensor:
  - platform: gpio
    name: "Interruptor 1"
    pin:
      number: 2
      mode: INPUT_PULLUP
      inverted: true
    id: interruptor1
    on_press:
      then:
        if:
          condition:
            lambda: 'return (((id(interruptor1tipo).current_option() == "Comum") && id(interruptor1conectado).state) || ((id(interruptor1tipo).current_option() == "Pulso") && id(interruptor1conectado).state));'
          then:
            switch.toggle: rele1
    on_release:
      then:
        if:
          condition:
            lambda: 'return ((id(interruptor1tipo).current_option() == "Comum") && id(interruptor1conectado).state);'
          then:
            switch.toggle: rele1
    on_multi_click:
      - timing:
          - ON for at most 900ms
          - OFF for at least 600ms
        then:
          - text_sensor.template.publish:
              id: interruptor1acao
              state: "1_single"
          - delay: 1s
          - text_sensor.template.publish:
              id: interruptor1acao
              state: "Nenhuma"
      - timing:
          - ON for at most 500ms
          - OFF for at most 400ms
          - ON for at most 500ms
          - OFF for at least 250ms
        then:
          - text_sensor.template.publish:
              id: interruptor1acao
              state: "1_double"
          - delay: 1s
          - text_sensor.template.publish:
              id: interruptor1acao
              state: "Nenhuma"
      - timing:
          - ON for at least 1s
        then:
          - text_sensor.template.publish:
              id: interruptor1acao
              state: "1_hold"
          - delay: 1s
          - text_sensor.template.publish:
              id: interruptor1acao
              state: "Nenhuma"

  - platform: gpio
    name: "Interruptor 2"
    pin:
      number: 0
      mode: INPUT_PULLUP
      inverted: true
    id: interruptor2
    on_press:
      then:
        if:
          condition:
            lambda: 'return (((id(interruptor2tipo).current_option() == "Comum") && id(interruptor2conectado).state) || ((id(interruptor2tipo).current_option() == "Pulso") && id(interruptor2conectado).state));'
          then:
            switch.toggle: rele2
    on_release:
      then:
        if:
          condition:
            lambda: 'return ((id(interruptor2tipo).current_option() == "Comum") && id(interruptor2conectado).state);'
          then:
            switch.toggle: rele2
    on_multi_click:
      - timing:
          - ON for at most 900ms
          - OFF for at least 600ms
        then:
          - text_sensor.template.publish:
              id: interruptor2acao
              state: "1_single"
          - delay: 1s
          - text_sensor.template.publish:
              id: interruptor2acao
              state: "Nenhuma"
      - timing:
          - ON for at most 500ms
          - OFF for at most 400ms
          - ON for at most 500ms
          - OFF for at least 250ms
        then:
          - text_sensor.template.publish:
              id: interruptor2acao
              state: "1_double"
          - delay: 1s
          - text_sensor.template.publish:
              id: interruptor2acao
              state: "Nenhuma"
      - timing:
          - ON for at least 1s
        then:
          - text_sensor.template.publish:
              id: interruptor2acao
              state: "1_hold"
          - delay: 1s
          - text_sensor.template.publish:
              id: interruptor2acao
              state: "Nenhuma"

sensor:
  - platform: uptime
    name: "Uptime Seconds"
    id: uptime_seconds
    update_interval: 1s
    internal: true

number:
  - platform: template
    name: "Rele 1 Tempo Máx. (s)"
    id: rele1_max_on_number
    min_value: 0
    max_value: 86400
    step: 1
    optimistic: true
    set_action:
      - globals.set:
          id: rele1_max_on
          value: !lambda 'return (int)x;'
      - if:
          condition:
            - switch.is_on: rele1
            - lambda: 'return (id(rele1_max_on) > 0) && (((int)id(uptime_seconds).state - id(rele1_on_time)) >= id(rele1_max_on));'
          then:
            - lambda: |-
                if (id(timeout_log_enabled)) {
                  ESP_LOGI("rele_timeout", "Rele 1 desligado por timeout (max=%d s, elapsed=%d s)",
                    id(rele1_max_on), ((int)id(uptime_seconds).state - id(rele1_on_time)));
                }
            - switch.turn_off: rele1
            - globals.set:
                id: rele1_on_time
                value: '0'

  - platform: template
    name: "Rele 2 Tempo Máx. (s)"
    id: rele2_max_on_number
    min_value: 0
    max_value: 86400
    step: 1
    optimistic: true
    set_action:
      - globals.set:
          id: rele2_max_on
          value: !lambda 'return (int)x;'
      - if:
          condition:
            - switch.is_on: rele2
            - lambda: 'return (id(rele2_max_on) > 0) && (((int)id(uptime_seconds).state - id(rele2_on_time)) >= id(rele2_max_on));'
          then:
            - lambda: |-
                if (id(timeout_log_enabled)) {
                  ESP_LOGI("rele_timeout", "Rele 2 desligado por timeout (max=%d s, elapsed=%d s)",
                    id(rele2_max_on), ((int)id(uptime_seconds).state - id(rele2_on_time)));
                }
            - switch.turn_off: rele2
            - globals.set:
                id: rele2_on_time
                value: '0'

interval:
  - interval: 1s
    then:
      - if:
          condition:
            - switch.is_on: rele1
            - lambda: 'return (id(rele1_max_on) > 0) && (((int)id(uptime_seconds).state - id(rele1_on_time)) >= id(rele1_max_on));'
          then:
            - lambda: |-
                if (id(timeout_log_enabled)) {
                  ESP_LOGI("rele_timeout", "Rele 1 desligado por timeout (max=%d s, elapsed=%d s)",
                    id(rele1_max_on), ((int)id(uptime_seconds).state - id(rele1_on_time)));
                }
            - switch.turn_off: rele1
            - globals.set:
                id: rele1_on_time
                value: '0'
      - if:
          condition:
            - switch.is_on: rele2
            - lambda: 'return (id(rele2_max_on) > 0) && (((int)id(uptime_seconds).state - id(rele2_on_time)) >= id(rele2_max_on));'
          then:
            - lambda: |-
                if (id(timeout_log_enabled)) {
                  ESP_LOGI("rele_timeout", "Rele 2 desligado por timeout (max=%d s, elapsed=%d s)",
                    id(rele2_max_on), ((int)id(uptime_seconds).state - id(rele2_on_time)));
                }
            - switch.turn_off: rele2
            - globals.set:
                id: rele2_on_time
                value: '0'