- id: '1700602171816'
  alias: Restart VsCode Memory Leak
  description: ''
  trigger:
  - platform: numeric_state
    entity_id: sensor.studio_code_server_memory_percent
    above: 20
  action:
  - service: hassio.addon_restart
    data:
      addon: a0d7b954_vscode
  mode: single
- id: '1777920917535'
  alias: Reativar proteção automática (delay)
  description: Quando proteger_numeros for desativado, aguarda X minutos e reativa
    se ainda estiver desativado.
  triggers:
  - entity_id: input_boolean.proteger_numeros
    to: 'off'
    trigger: state
  actions:
  - delay: 00:05:00
  - condition: state
    entity_id: input_boolean.proteger_numeros
    state: 'off'
  - target:
      entity_id: input_boolean.proteger_numeros
    action: input_boolean.turn_on
  mode: restart
